# Metapus Single-Tenant Deployment (local build)
#
# First-time setup:
#   1. Copy .env.example to .env and edit values
#   2. docker compose build
#   3. docker compose up -d postgres
#   4. docker compose --profile init run --rm init init-meta
#   5. docker compose --profile init run --rm init create --slug default --name "My Company"
#      (creates mt_default database, runs migrations, registers tenant — note the Tenant ID)
#   6. Set TENANT_ID in .env, then: docker compose build frontend
#   7. docker compose up -d
#
# Initial admin credentials are supplied explicitly to cmd/seed.

services:
  crypto-ingestion-monitor:
    profiles: ["crypto-monitor"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: ingestion-monitor
      args:
        VERSION: ${METAPUS_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://metapus:${POSTGRES_PASSWORD:-metapus}@postgres:5432/mt_default?sslmode=disable
      TENANT_ID: ${TENANT_ID:-}
      AUTOMATION_ENCRYPTION_KEY: ${AUTOMATION_ENCRYPTION_KEY:-}
      CRYPTO_CHAIN_CONFIG_FILE: /run/metapus/crypto/chains.json
      CRYPTO_RPC_DNS_TLS_SERVER: ${CRYPTO_RPC_DNS_TLS_SERVER:-}
      CRYPTO_INGESTION_MONITOR_INTERVAL: ${CRYPTO_INGESTION_MONITOR_INTERVAL:-30s}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      CRYPTO_APPROVAL_POLICY_PUBLIC_KEY: ${CRYPTO_APPROVAL_POLICY_PUBLIC_KEY:-}
      CRYPTO_INTENT_SIGNING_PUBLIC_KEY: ${CRYPTO_INTENT_SIGNING_PUBLIC_KEY:-}
      CRYPTO_RISK_ASSESSMENT_SIGNING_PUBLIC_KEY: ${CRYPTO_RISK_ASSESSMENT_SIGNING_PUBLIC_KEY:-}
      CRYPTO_POLICY_DECISION_SIGNING_PUBLIC_KEY: ${CRYPTO_POLICY_DECISION_SIGNING_PUBLIC_KEY:-}
      CRYPTO_ADMIN_APPROVAL_SIGNING_PUBLIC_KEY: ${CRYPTO_ADMIN_APPROVAL_SIGNING_PUBLIC_KEY:-}
      CRYPTO_RISK_APPROVAL_SIGNING_PUBLIC_KEY: ${CRYPTO_RISK_APPROVAL_SIGNING_PUBLIC_KEY:-}
    volumes:
      - ${CRYPTO_CHAIN_CONFIG_FILE_HOST:-../deployments/crypto/chains.example.json}:/run/metapus/crypto/chains.json:ro
      - ingestion-monitor-data:/var/lib/metapus/ingestion-monitor
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "./healthcheck", "http://localhost:8092/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - metapus-net
  pdf-renderer:
    build:
      context: ..
      dockerfile: deployments/pdf-renderer/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    pids_limit: 256
    mem_limit: 512m
    cpus: 2
    security_opt:
      - seccomp=../deployments/pdf-renderer/seccomp_profile.json
    networks:
      - pdf-internal

  # --- PostgreSQL ---
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: metapus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metapus}
      POSTGRES_DB: tenants
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - metapus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metapus -d tenants"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Тестовый Vault: запрещён для кошельков с реальной стоимостью ---
  vault-test:
    profiles: ["vault-test"]
    build:
      context: ..
      dockerfile: deployments/vault-test/Dockerfile
    restart: unless-stopped
    command: ["server"]
    environment:
      VAULT_CACERT: /vault/tls/ca.crt
    volumes:
      - vault-test-data:/vault/data
      - ../deployments/vault-test/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault-test/tls:/vault/tls:ro
    ports:
      - "127.0.0.1:${VAULT_TEST_PORT:-8200}:8200"
    networks:
      vault-control:
        ipv4_address: ${VAULT_TEST_CONTROL_IP:-172.30.251.11}
    healthcheck:
      test: ["CMD-SHELL", "vault status -ca-cert=/vault/tls/ca.crt >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Для встроенного тестового Vault используйте --profile vault-test.
  # Для внешнего Vault: --profile vault-proxy и VAULT_PROXY_CONFIG_FILE.
  vault-proxy:
    profiles: ["vault-test", "vault-proxy"]
    image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
    restart: "no"
    command: ["proxy", "-config=/vault-proxy/config.hcl"]
    volumes:
      - ${VAULT_PROXY_CONFIG_FILE:-../deployments/vault-test/proxy-test.hcl}:/vault-proxy/config.hcl:ro
      - ${VAULT_CA_CERT_FILE:-./vault-test/tls/ca.crt}:/vault-proxy/ca/ca.crt:ro
      - ${VAULT_ROLE_ID_FILE:-./vault-test/bootstrap/role-id}:/run/metapus/vault-role/role-id:ro
      - ${VAULT_BOOTSTRAP_DIR:-./vault-test/bootstrap}:/run/metapus/vault-bootstrap
    networks:
      vault-control:
        ipv4_address: ${VAULT_PROXY_CONTROL_IP:-172.30.251.10}
      vault-worker:

  # --- One-time init (tenant CLI with shell) ---
  # Usage: docker compose --profile init run --rm init init-meta
  #        docker compose --profile init run --rm init create --slug default --name "My Company"
  #        docker compose --profile init run --rm init migrate --all
  init:
    build:
      context: ..
      dockerfile: Dockerfile
      target: init
      args:
        VERSION: ${METAPUS_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      META_DATABASE_URL: postgres://metapus:${POSTGRES_PASSWORD:-metapus}@postgres:5432/tenants?sslmode=disable
      TENANT_DB_USER: metapus
      TENANT_DB_PASSWORD: ${POSTGRES_PASSWORD:-metapus}
      TENANT_DB_HOST: postgres
    networks:
      - metapus-net
    profiles:
      - init

  # --- Metapus API Server ---
  metapus-app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${METAPUS_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PDF_RENDERER_URL: http://pdf-renderer:8081
      APP_PORT: "8080"
      APP_ENV: "production"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_STATE_CACHE_TTL: ${AUTH_STATE_CACHE_TTL:-5m}
      AUTH_STATE_CACHE_MAX_ENTRIES: ${AUTH_STATE_CACHE_MAX_ENTRIES:-10000}
      SECURITY_PROFILE_CACHE_TTL: ${SECURITY_PROFILE_CACHE_TTL:-5m}
      SECURITY_PROFILE_CACHE_MAX_ENTRIES: ${SECURITY_PROFILE_CACHE_MAX_ENTRIES:-10000}
      PUBLIC_CHECKOUT_BASE_URL: ${PUBLIC_CHECKOUT_BASE_URL:-}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:-}
      ADMIN_MFA_MODE: ${ADMIN_MFA_MODE:-required}
      ADMIN_MFA_GRACE_PERIOD_HOURS: ${ADMIN_MFA_GRACE_PERIOD_HOURS:-168}
      ADMIN_STEP_UP_TTL_SECONDS: ${ADMIN_STEP_UP_TTL_SECONDS:-300}
      ADMIN_SECURITY_MODE: ${ADMIN_SECURITY_MODE:-warn}
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      META_DATABASE_URL: postgres://metapus:${POSTGRES_PASSWORD:-metapus}@postgres:5432/tenants?sslmode=disable
      DATABASE_URL: postgres://metapus:${POSTGRES_PASSWORD:-metapus}@postgres:5432/mt_default?sslmode=disable
      TENANT_DB_USER: metapus
      TENANT_DB_PASSWORD: ${POSTGRES_PASSWORD:-metapus}
      TENANT_DB_HOST: postgres
      AUTOMATION_ENCRYPTION_KEY: ${AUTOMATION_ENCRYPTION_KEY:-}
      CRYPTO_RPC_DNS_TLS_SERVER: ${CRYPTO_RPC_DNS_TLS_SERVER:-}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault-proxy:8100}
      CRYPTO_TRANSIT_MOUNT: ${CRYPTO_TRANSIT_MOUNT:-transit}
      CRYPTO_APPROVAL_POLICY_PUBLIC_KEY: ${CRYPTO_APPROVAL_POLICY_PUBLIC_KEY:-}
      CRYPTO_APPROVAL_POLICY_BUNDLE_JWS: ${CRYPTO_APPROVAL_POLICY_BUNDLE_JWS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      pdf-internal:
      metapus-net:
        aliases:
          - metapus-app
      vault-worker:
    healthcheck:
      test: ["CMD", "./healthcheck", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Background Worker ---
  metapus-worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${METAPUS_VERSION:-dev}
    restart: unless-stopped
    entrypoint: ["./worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: "production"
      CRYPTO_PROCESSING_ENABLED: ${CRYPTO_PROCESSING_ENABLED:-false}
      CRYPTO_CHAIN_CONFIG_FILE: /run/metapus/crypto/chains.json
      CRYPTO_RPC_DNS_TLS_SERVER: ${CRYPTO_RPC_DNS_TLS_SERVER:-}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault-proxy:8100}
      CRYPTO_AUTH_SIGNER: ${CRYPTO_AUTH_SIGNER:-}
      CRYPTO_TRANSIT_MOUNT: ${CRYPTO_TRANSIT_MOUNT:-transit}
      CRYPTO_APPROVAL_POLICY_PUBLIC_KEY: ${CRYPTO_APPROVAL_POLICY_PUBLIC_KEY:-}
      CRYPTO_INTENT_SIGNING_PUBLIC_KEY: ${CRYPTO_INTENT_SIGNING_PUBLIC_KEY:-}
      CRYPTO_RISK_ASSESSMENT_SIGNING_PUBLIC_KEY: ${CRYPTO_RISK_ASSESSMENT_SIGNING_PUBLIC_KEY:-}
      CRYPTO_POLICY_DECISION_SIGNING_PUBLIC_KEY: ${CRYPTO_POLICY_DECISION_SIGNING_PUBLIC_KEY:-}
      CRYPTO_ADMIN_APPROVAL_SIGNING_PUBLIC_KEY: ${CRYPTO_ADMIN_APPROVAL_SIGNING_PUBLIC_KEY:-}
      CRYPTO_RISK_APPROVAL_SIGNING_PUBLIC_KEY: ${CRYPTO_RISK_APPROVAL_SIGNING_PUBLIC_KEY:-}
      META_DATABASE_URL: postgres://metapus:${POSTGRES_PASSWORD:-metapus}@postgres:5432/tenants?sslmode=disable
      TENANT_DB_USER: metapus
      TENANT_DB_PASSWORD: ${POSTGRES_PASSWORD:-metapus}
      AUTOMATION_ENCRYPTION_KEY: ${AUTOMATION_ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${CRYPTO_CHAIN_CONFIG_FILE_HOST:-../deployments/crypto/chains.example.json}:/run/metapus/crypto/chains.json:ro
    networks:
      - metapus-net
      - vault-worker

  # --- Frontend (Next.js) ---
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TENANT_ID: ${TENANT_ID:-}
        API_PROXY_URL: http://metapus-app:8080
    restart: unless-stopped
    depends_on:
      metapus-app:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_TENANT_ID: ${TENANT_ID:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - metapus-net

networks:
  pdf-internal:
    internal: true
  metapus-net:
    driver: bridge
  vault-control:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${VAULT_CONTROL_SUBNET:-172.30.251.0/24}
  vault-worker:
    driver: bridge
    internal: true

volumes:
  ingestion-monitor-data:
  pgdata:
  vault-test-data:
