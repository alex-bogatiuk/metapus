# Internet-facing crypto test override (Nile or Sepolia).
# Requires Docker Compose 2.24.4+ for !reset/!override merge tags.
services:
  postgres:
    ports: !reset []
    environment: !override
      POSTGRES_USER: metapus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: tenants
    secrets:
      - postgres_password
    security_opt:
      - no-new-privileges:true
    networks:
      metapus-net:
        ipv4_address: 172.30.250.20

  init:
    environment: !override
      META_DATABASE_URL_FILE: /run/secrets/meta_database_url
      TENANT_DB_USER: metapus
      TENANT_DB_PASSWORD_FILE: /run/secrets/postgres_password
      TENANT_DB_HOST: postgres
    secrets:
      - meta_database_url
      - postgres_password
    security_opt:
      - no-new-privileges:true
    networks:
      metapus-net:
        ipv4_address: 172.30.250.21

  vault-test:
    ports: !reset []
    volumes:
      - vault-test-data:/vault/data
      - ../deployments/vault-test/vault.hcl:/vault/config/vault.hcl:ro
      - ${PUBLIC_TEST_STATE_DIR:?PUBLIC_TEST_STATE_DIR is required}/vault/tls:/vault/tls:ro
    security_opt:
      - no-new-privileges:true

  vault-proxy:
    image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
    security_opt:
      - no-new-privileges:true

  metapus-app:
    ports: !reset []
    environment: !override
      PDF_RENDERER_URL: http://pdf-renderer:8081
      APP_PORT: "8080"
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ALLOWED_ORIGINS: https://${PUBLIC_IP:?PUBLIC_IP is required},http://localhost:3000
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_IP:?PUBLIC_IP is required},http://localhost:3000
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      AUTH_STATE_CACHE_TTL: ${AUTH_STATE_CACHE_TTL:-5m}
      AUTH_STATE_CACHE_MAX_ENTRIES: ${AUTH_STATE_CACHE_MAX_ENTRIES:-10000}
      SECURITY_PROFILE_CACHE_TTL: ${SECURITY_PROFILE_CACHE_TTL:-5m}
      SECURITY_PROFILE_CACHE_MAX_ENTRIES: ${SECURITY_PROFILE_CACHE_MAX_ENTRIES:-10000}
      PUBLIC_CHECKOUT_BASE_URL: https://${PUBLIC_IP:?PUBLIC_IP is required}
      AUTH_MFA_ENCRYPTION_KEY_FILE: /run/secrets/auth_mfa_encryption_key
      ADMIN_MFA_MODE: ${ADMIN_MFA_MODE:-optional}
      ADMIN_MFA_GRACE_PERIOD_HOURS: "0"
      ADMIN_STEP_UP_TTL_SECONDS: "300"
      ADMIN_SECURITY_MODE: ${ADMIN_SECURITY_MODE:-warn}
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:-}
      AUTH_ALLOW_SELF_REGISTRATION: ${AUTH_ALLOW_SELF_REGISTRATION:-false}
      CONTROL_PLANE_TENANT_ID: ${CONTROL_PLANE_TENANT_ID:-}
      TRUSTED_PROXIES: 172.30.250.10/32
      META_DATABASE_URL_FILE: /run/secrets/meta_database_url
      TENANT_DB_USER: metapus
      TENANT_DB_PASSWORD_FILE: /run/secrets/postgres_password
      TENANT_DB_HOST: postgres
      AUTOMATION_ENCRYPTION_KEY_FILE: /run/secrets/automation_encryption_key
      CRYPTO_RPC_DNS_TLS_SERVER: ${CRYPTO_RPC_DNS_TLS_SERVER:-}
      VAULT_ADDR: http://vault-proxy:8100
      CRYPTO_TRANSIT_MOUNT: transit
      CRYPTO_APPROVAL_POLICY_PUBLIC_KEY: ${CRYPTO_APPROVAL_POLICY_PUBLIC_KEY:-}
      CRYPTO_APPROVAL_POLICY_BUNDLE_JWS_FILE: /run/secrets/crypto_approval_policy_bundle_jws
    secrets:
      - jwt_secret
      - auth_mfa_encryption_key
      - meta_database_url
      - postgres_password
      - automation_encryption_key
      - crypto_approval_policy_bundle_jws
    security_opt:
      - no-new-privileges:true
    networks:
      metapus-net:
        ipv4_address: 172.30.250.30
      vault-worker:

  seed:
    build:
      context: ..
      dockerfile: Dockerfile
      target: init
      args:
        VERSION: ${METAPUS_VERSION:-dev}
    profiles: ["init"]
    entrypoint: ["./seed"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/tenant_database_url
      META_DATABASE_URL_FILE: /run/secrets/meta_database_url
      SEED_DEMO_DATA: "true"
      SEED_CRYPTO_HISTORY: "false"
      ADMIN_EMAIL: admin@metapus.io
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      AUTOMATION_ENCRYPTION_KEY_FILE: /run/secrets/automation_encryption_key
    secrets:
      - tenant_database_url
      - meta_database_url
      - admin_password
      - automation_encryption_key
    security_opt:
      - no-new-privileges:true
    networks:
      metapus-net:
        ipv4_address: 172.30.250.22

  public-test-bootstrap:
    build:
      context: ..
      dockerfile: Dockerfile
      target: init
      args:
        VERSION: ${METAPUS_VERSION:-dev}
    profiles: ["operator"]
    entrypoint: ["./public-test-bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${PUBLIC_TEST_STATE_DIR:?PUBLIC_TEST_STATE_DIR is required}:/state
    security_opt:
      - no-new-privileges:true
    networks:
      metapus-net:
        ipv4_address: 172.30.250.23
      vault-control:
        ipv4_address: ${VAULT_OPERATOR_CONTROL_IP:-172.30.251.12}

  vault-bootstrap-permissions:
    image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
    profiles: ["operator"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if chown -R 100:1000 /bootstrap 2>/dev/null; then
          chmod 0700 /bootstrap
          chmod 0444 /bootstrap/role-id
          chmod 0400 /bootstrap/wrapped-secret-id
        else
          test "$(stat -c %a /bootstrap/role-id)" = "444"
          test "$(stat -c %a /bootstrap/wrapped-secret-id)" = "444"
        fi
    volumes:
      - ${VAULT_BOOTSTRAP_DIR:?VAULT_BOOTSTRAP_DIR is required}:/bootstrap
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

  runtime-secret-permissions:
    image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
    profiles: ["operator"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        runtime_files="
          postgres_password
          meta_database_url
          tenant_database_url
          admin_password
          jwt_secret
          auth_mfa_encryption_key
          automation_encryption_key
          crypto_approval_policy_bundle_jws
          tron_api_key
        "
        for name in $${runtime_files}; do
          test -f "/runtime-secrets/$${name}"
          test ! -L "/runtime-secrets/$${name}"
        done
        normalized=true
        for name in $${runtime_files}; do
          if ! chown 65532:65532 "/runtime-secrets/$${name}" 2>/dev/null ||
             ! chmod 0400 "/runtime-secrets/$${name}" 2>/dev/null; then
            normalized=false
            break
          fi
        done
        if [ "$${normalized}" != "true" ]; then
          for name in $${runtime_files}; do
            test "$(stat -c %u "/runtime-secrets/$${name}")" = "65532"
            test "$(stat -c %g "/runtime-secrets/$${name}")" = "65532"
            test "$(stat -c %a "/runtime-secrets/$${name}")" = "400"
          done
        fi
    volumes:
      - ${PUBLIC_TEST_SECRET_DIR:?PUBLIC_TEST_SECRET_DIR is required}:/runtime-secrets
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

  crypto-preflight:
    build:
      context: ..
      dockerfile: Dockerfile
      target: init
      args:
        VERSION: ${METAPUS_VERSION:-dev}
    profiles: ["operator"]
    entrypoint: ["./crypto-preflight"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/tenant_database_url
      AUTOMATION_ENCRYPTION_KEY_FILE: /run/secrets/automation_encryption_key
      TENANT_ID: ${TENANT_ID:?TENANT_ID is required}
      CRYPTO_CHAIN_CONFIG_FILE: /run/metapus/crypto/chains.json
      CRYPTO_RPC_DNS_TLS_SERVER: ${CRYPTO_RPC_DNS_TLS_SERVER:-}
      CRYPTO_NETWORK_CODE: ${CRYPTO_NETWORK_CODE:-TRON-NILE}
      CRYPTO_PREFLIGHT_NETWORK_CODE: ${CRYPTO_NETWORK_CODE:-TRON-NILE}
      VAULT_ADDR: http://vault-proxy:8100
      CRYPTO_AUTH_SIGNER: transit
      CRYPTO_TRANSIT_MOUNT: transit
      CRYPTO_APPROVAL_POLICY_PUBLIC_KEY: ${CRYPTO_APPROVAL_POLICY_PUBLIC_KEY:-}
      CRYPTO_INTENT_SIGNING_PUBLIC_KEY: ${CRYPTO_INTENT_SIGNING_PUBLIC_KEY:-}
      CRYPTO_RISK_ASSESSMENT_SIGNING_PUBLIC_KEY: ${CRYPTO_RISK_ASSESSMENT_SIGNING_PUBLIC_KEY:-}
      CRYPTO_POLICY_DECISION_SIGNING_PUBLIC_KEY: ${CRYPTO_POLICY_DECISION_SIGNING_PUBLIC_KEY:-}
      CRYPTO_ADMIN_APPROVAL_SIGNING_PUBLIC_KEY: ${CRYPTO_ADMIN_APPROVAL_SIGNING_PUBLIC_KEY:-}
      CRYPTO_RISK_APPROVAL_SIGNING_PUBLIC_KEY: ${CRYPTO_RISK_APPROVAL_SIGNING_PUBLIC_KEY:-}
    secrets:
      - tenant_database_url
      - automation_encryption_key
      - tron_api_key
    volumes:
      - ${PUBLIC_TEST_STATE_DIR:?PUBLIC_TEST_STATE_DIR is required}/crypto/chains.json:/run/metapus/crypto/chains.json:ro
    security_opt:
      - no-new-privileges:true
    networks:
      metapus-net:
        ipv4_address: 172.30.250.24
      vault-worker: {}

  crypto-ingestion-monitor:
    profiles: !reset []
    depends_on:
      metrics-sink:
        condition: service_healthy
    environment: !override
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/tenant_database_url
      AUTOMATION_ENCRYPTION_KEY_FILE: /run/secrets/automation_encryption_key
      TENANT_ID: ${TENANT_ID:?TENANT_ID is required}
      CRYPTO_CHAIN_CONFIG_FILE: /run/metapus/crypto/chains.json
      CRYPTO_RPC_DNS_TLS_SERVER: ${CRYPTO_RPC_DNS_TLS_SERVER:-}
      CRYPTO_INGESTION_MONITOR_INTERVAL: ${CRYPTO_INGESTION_MONITOR_INTERVAL:-30s}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://metrics-sink:4317
      CRYPTO_APPROVAL_POLICY_PUBLIC_KEY: ${CRYPTO_APPROVAL_POLICY_PUBLIC_KEY:-}
      CRYPTO_INTENT_SIGNING_PUBLIC_KEY: ${CRYPTO_INTENT_SIGNING_PUBLIC_KEY:-}
      CRYPTO_RISK_ASSESSMENT_SIGNING_PUBLIC_KEY: ${CRYPTO_RISK_ASSESSMENT_SIGNING_PUBLIC_KEY:-}
      CRYPTO_POLICY_DECISION_SIGNING_PUBLIC_KEY: ${CRYPTO_POLICY_DECISION_SIGNING_PUBLIC_KEY:-}
      CRYPTO_ADMIN_APPROVAL_SIGNING_PUBLIC_KEY: ${CRYPTO_ADMIN_APPROVAL_SIGNING_PUBLIC_KEY:-}
      CRYPTO_RISK_APPROVAL_SIGNING_PUBLIC_KEY: ${CRYPTO_RISK_APPROVAL_SIGNING_PUBLIC_KEY:-}
    secrets:
      - tenant_database_url
      - automation_encryption_key
      - tron_api_key
    volumes: !override
      - ${PUBLIC_TEST_STATE_DIR:?PUBLIC_TEST_STATE_DIR is required}/crypto/chains.json:/run/metapus/crypto/chains.json:ro
      - ingestion-monitor-data:/var/lib/metapus/ingestion-monitor
    networks:
      metapus-net:
        ipv4_address: 172.30.250.61

  metrics-sink:
    build:
      context: ..
      dockerfile: deployments/public-test-metrics-sink/Dockerfile
    image: metapus-public-test-metrics-sink:latest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/public-test-metrics-sink", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      metapus-net:
        ipv4_address: 172.30.250.60

  metapus-worker:
    depends_on:
      metrics-sink:
        condition: service_healthy
    environment: !override
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CRYPTO_PROCESSING_ENABLED: "true"
      CRYPTO_CHAIN_CONFIG_FILE: /run/metapus/crypto/chains.json
      CRYPTO_RPC_DNS_TLS_SERVER: ${CRYPTO_RPC_DNS_TLS_SERVER:-}
      VAULT_ADDR: http://vault-proxy:8100
      CRYPTO_AUTH_SIGNER: transit
      CRYPTO_TRANSIT_MOUNT: transit
      CRYPTO_APPROVAL_POLICY_PUBLIC_KEY: ${CRYPTO_APPROVAL_POLICY_PUBLIC_KEY:-}
      CRYPTO_INTENT_SIGNING_PUBLIC_KEY: ${CRYPTO_INTENT_SIGNING_PUBLIC_KEY:-}
      CRYPTO_RISK_ASSESSMENT_SIGNING_PUBLIC_KEY: ${CRYPTO_RISK_ASSESSMENT_SIGNING_PUBLIC_KEY:-}
      CRYPTO_POLICY_DECISION_SIGNING_PUBLIC_KEY: ${CRYPTO_POLICY_DECISION_SIGNING_PUBLIC_KEY:-}
      CRYPTO_ADMIN_APPROVAL_SIGNING_PUBLIC_KEY: ${CRYPTO_ADMIN_APPROVAL_SIGNING_PUBLIC_KEY:-}
      CRYPTO_RISK_APPROVAL_SIGNING_PUBLIC_KEY: ${CRYPTO_RISK_APPROVAL_SIGNING_PUBLIC_KEY:-}
      META_DATABASE_URL_FILE: /run/secrets/meta_database_url
      TENANT_DB_USER: metapus
      TENANT_DB_PASSWORD_FILE: /run/secrets/postgres_password
      AUTOMATION_ENCRYPTION_KEY_FILE: /run/secrets/automation_encryption_key
      CRYPTO_RESOURCE_LEASE_TARGET_ENERGY: ${CRYPTO_RESOURCE_LEASE_TARGET_ENERGY:-65000}
      CRYPTO_RESOURCE_SAFETY_MARGIN_PCT: ${CRYPTO_RESOURCE_SAFETY_MARGIN_PCT:-10}
      CRYPTO_RESOURCE_RESERVATION_CUTOFF_SECONDS: ${CRYPTO_RESOURCE_RESERVATION_CUTOFF_SECONDS:-120}
      CRYPTO_APPROVAL_POLICY_BUNDLE_JWS_FILE: /run/secrets/crypto_approval_policy_bundle_jws
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://metrics-sink:4317
    secrets:
      - meta_database_url
      - postgres_password
      - automation_encryption_key
      - tron_api_key
      - crypto_approval_policy_bundle_jws
    volumes:
      - ${PUBLIC_TEST_STATE_DIR:?PUBLIC_TEST_STATE_DIR is required}/crypto/chains.json:/run/metapus/crypto/chains.json:ro
    security_opt:
      - no-new-privileges:true
    networks:
      metapus-net:
        ipv4_address: 172.30.250.40
      vault-worker: {}

  frontend:
    build:
      args:
        NEXT_PUBLIC_TENANT_ID: ${TENANT_ID:-}
        API_PROXY_URL: http://metapus-app:8080
        # Docker Desktop fallback. Set PUBLIC_TEST_NPM_HTTPS_PROXY= (empty)
        # when the builder has direct HTTPS egress.
        NPM_HTTPS_PROXY: ${PUBLIC_TEST_NPM_HTTPS_PROXY-http://host.docker.internal:19444}
    ports: !reset []
    security_opt:
      - no-new-privileges:true
    networks:
      metapus-net:
        ipv4_address: 172.30.250.50

  reverse-proxy:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?PUBLIC_IP is required}
      NGINX_MODE: ${NGINX_MODE:-https}
    entrypoint: ["/bin/sh", "/opt/metapus/nginx-watch.sh"]
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
    volumes:
      - ./public-test/nginx:/opt/metapus:ro
      - public-test-acme:/var/www/certbot:ro
      - public-test-letsencrypt:/etc/letsencrypt:ro
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      metapus-net:
        ipv4_address: 172.30.250.10

  certbot:
    image: certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    profiles: ["tls-tools"]
    environment:
      # Docker Desktop fallback. Set PUBLIC_TEST_ACME_HTTPS_PROXY= (empty)
      # when the container has direct HTTPS egress.
      HTTPS_PROXY: ${PUBLIC_TEST_ACME_HTTPS_PROXY-http://host.docker.internal:19445}
      https_proxy: ${PUBLIC_TEST_ACME_HTTPS_PROXY-http://host.docker.internal:19445}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - public-test-acme:/var/www/certbot
      - public-test-letsencrypt:/etc/letsencrypt
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - metapus-net

  certbot-renew:
    image: certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?PUBLIC_IP is required}
      HTTPS_PROXY: ${PUBLIC_TEST_ACME_HTTPS_PROXY-http://host.docker.internal:19445}
      https_proxy: ${PUBLIC_TEST_ACME_HTTPS_PROXY-http://host.docker.internal:19445}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/opt/metapus/certbot-renew.sh"]
    volumes:
      - ./public-test/certbot-renew.sh:/opt/metapus/certbot-renew.sh:ro
      - public-test-acme:/var/www/certbot
      - public-test-letsencrypt:/etc/letsencrypt
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - metapus-net

networks:
  metapus-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/24

secrets:
  postgres_password:
    file: ${PUBLIC_TEST_SECRET_DIR:?PUBLIC_TEST_SECRET_DIR is required}/postgres_password
  meta_database_url:
    file: ${PUBLIC_TEST_SECRET_DIR:?PUBLIC_TEST_SECRET_DIR is required}/meta_database_url
  tenant_database_url:
    file: ${PUBLIC_TEST_SECRET_DIR:?PUBLIC_TEST_SECRET_DIR is required}/tenant_database_url
  admin_password:
    file: ${PUBLIC_TEST_SECRET_DIR:?PUBLIC_TEST_SECRET_DIR is required}/admin_password
  jwt_secret:
    file: ${PUBLIC_TEST_SECRET_DIR:?PUBLIC_TEST_SECRET_DIR is required}/jwt_secret
  auth_mfa_encryption_key:
    file: ${PUBLIC_TEST_SECRET_DIR:?PUBLIC_TEST_SECRET_DIR is required}/auth_mfa_encryption_key
  automation_encryption_key:
    file: ${PUBLIC_TEST_SECRET_DIR:?PUBLIC_TEST_SECRET_DIR is required}/automation_encryption_key
  crypto_approval_policy_bundle_jws:
    file: ${PUBLIC_TEST_SECRET_DIR:?PUBLIC_TEST_SECRET_DIR is required}/crypto_approval_policy_bundle_jws
  tron_api_key:
    file: ${PUBLIC_TEST_SECRET_DIR:?PUBLIC_TEST_SECRET_DIR is required}/tron_api_key

volumes:
  public-test-acme:
  public-test-letsencrypt:
